[project]
name = "teton-streaming-backend"
version = "1.0.0"
description = "Real-time streaming backend for care-room sensor events"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".venv",
    "migrations",
    # Provided by the challenge; kept verbatim so the harness is unmodified.
    "event_generator",
    "eval",
    "example_solution",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "SIM",  # simplify
    "RUF",  # ruff-specific
]
ignore = [
    "B008",   # function call in default argument: not used here
    "RUF012", # mutable class attrs need ClassVar: noisy for Django models
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["api", "client", "config", "engine"]
